        <h2>Essays for DIGIT 100</h2>
   <figure class="text">     <p>1. Comparative Website Reflection</p>
        <p> For DIGIT 100 I have created two of the same, or similar, websites but on different
            platforms. The first being made for GitHub using HTML and the other using WordPress from
            Penn State. The other website can be found <a
                href="https://sites.psu.edu/kjd6231portfolio/">here</a>. These two ways are very
            different, and both have their ups and their downs.</p>
        <p>HTML is the first one that I used to make this website so naturally I have become more
            used to it than I have WordPress. I was able to catch on pretty quickly on how to create
            pages and putting the content inside of it. Adding images and creating multiple pages
            was kind of fun for me. To me all of that was very simple. In fact, I decided to create
            many different pages just because I thought it was simple and kind of fun. But where it
            got hard was with the css styling. Eventually I was able to make basic styling done with
            it but nothing super crazy. I want to continue to learn more with css just so that I’m
            able to have a much better looking website than I do now. </p>
        <p>WordPress was the second website to be made so it took some time to get used to things. I
            didn’t have to spend too much time making the stuff inside of the website considering it
            was already done. So, my main focus of this was to make it look good. With the templates
            that they provide it does make it very simple to make your website look really good. I
            do think that my WordPress website objectively looks way better than my GitHub one. But
            my downside with it is that it doesn’t feel as easy to create the actual pages of the
            website. I completely ignored my concerts page that was present on the GitHub website
            just because I knew it would take me a lot more time to do. I also don’t like how you
            insert media, it’s much more convenient with HTML.</p>
        <p>So since I have a lot more content on my GitHub website I think I’m going to try and keep
            that one up more than I will WordPress. Maybe I will try to do some more with WordPress
            just for my own entertainment, but we’ll see. I want to do more with css and become
            really good at it. And it’s more applicable to the real world since many people use
            GitHub and HTML for their websites. </p></figure>
